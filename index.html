<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시작 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-left">
        <a href="https://www.sdu.ac.kr/" target="_blank" class="sdu-logo-link">
            <span class="sdu-text">SDU</span> 서울디지털대학교
        </a>
    </div>
    <div class="top-right">
        <div id="weather-seoul" class="weather-widget">서울 날씨 로딩중...</div>
        <div id="weather-jeju" class="weather-widget">제주 날씨 로딩중...</div>
    </div>
    <div style="text-align: center; margin-top: 200px;">
        <input type="text" placeholder="Google 검색" style="width: 400px; padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
        <br><br>
        <button style="padding: 10px 20px; border: none; background: #f8f9fa; border-radius: 5px;">Google 검색</button>
        <button id="lucky-btn" style="padding: 10px 20px; border: none; background: #f8f9fa; border-radius: 5px;">I'm Feeling Lucky</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
